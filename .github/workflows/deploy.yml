name: Deploy Static Public Folder to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Replace deployment placeholders
        run: |
          PUBLIC_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          BUILD_ID="${GITHUB_SHA::8}"
          sed -i "s|__PUBLIC_URL__|${PUBLIC_URL}|g" public/index.html public/app.html
          sed -i "s|__BUILD_ID__|${BUILD_ID}|g" public/index.html public/app.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Targets the public folder where your HTML and client scripts live
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4